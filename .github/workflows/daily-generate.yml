name: Daily question generation

on:
  schedule:
    # 每天台灣時間 04:07（UTC 20:07）。GitHub 排程可能延遲數十分鐘。
    - cron: '7 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '題組日期 YYYY-MM-DD（留空為今天）'
        required: false
      force:
        description: '重新產生（僅限尚未作答的題組）'
        type: boolean
        default: false

concurrency:
  group: daily-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          python -m dailyenglish.main "${args[@]}"
