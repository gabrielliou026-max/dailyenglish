name: Daily question generation

on:
  schedule:
    # 每天台灣時間 04:07（UTC 20:07）。GitHub 排程可能延遲數十分鐘。
    - cron: '7 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '題組日期 YYYY-MM-DD（留空為今天）'
        required: false
      force:
        description: '重新產生（僅限尚未作答的題組）'
        type: boolean
        default: false

concurrency:
  group: daily-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      # 聽力語音模型（約 120 MB），快取起來不用每天下載
      - name: Cache Kokoro model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0-int8
      - name: Download Kokoro model
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p ~/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL --retry 3 -o ~/kokoro/kokoro-v1.0.int8.onnx "$base/kokoro-v1.0.int8.onnx"
          curl -fsSL --retry 3 -o ~/kokoro/voices-v1.0.bin "$base/voices-v1.0.bin"
      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          export KOKORO_MODEL="$HOME/kokoro/kokoro-v1.0.int8.onnx"
          export KOKORO_VOICES="$HOME/kokoro/voices-v1.0.bin"
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          python -m dailyenglish.main "${args[@]}"
