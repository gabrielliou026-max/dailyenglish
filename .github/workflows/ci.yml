name: CI

on:
  push:
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: de_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/de_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r generator/requirements-dev.txt
      - name: Apply schema
        run: |
          psql -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL" \
            -f supabase/tests/local_auth_stub.sql -f supabase/migrations/0001_init.sql \
            -f supabase/migrations/0002_listening_reading_formats.sql
      - run: python -m pytest -q
        working-directory: generator

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
